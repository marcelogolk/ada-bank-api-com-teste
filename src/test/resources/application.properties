# ── Datasource — H2 em memória ───────────────────────────────────────────────
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE,KEY
quarkus.datasource.username=test
quarkus.datasource.password=test

# ── Hibernate ────────────────────────────────────────────────────────────────
# substitui a propriedade deprecated
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Mapeia os @Enumerated(EnumType.STRING) como VARCHAR no H2
# (H2 não suporta o tipo ENUM nativo do PostgreSQL)
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect

# ── JWT ──────────────────────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://ada.com

# ── JaCoCo — necessário para contabilizar cobertura com @QuarkusTest ─────────
quarkus.jacoco.data-file=target/jacoco.exec
quarkus.jacoco.reuse-data-file=true

# ── Log ──────────────────────────────────────────────────────────────────────
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.category."org.hibernate.SQL".level=WARN